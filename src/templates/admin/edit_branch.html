{% extends "base.html" %}

{% block title %}Edit Branch - EV Charge{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h3 class="mb-4">Edit Branch: {{ branch.name }}</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Branch Name</label>
                    <input type="text" name="name" class="form-control" value="{{ branch.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control" value="{{ branch.location or '' }}" placeholder="e.g. T-Nagar, Chennai">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Latitude</label>
                        <input type="text" name="latitude" id="lat-input" class="form-control" value="{{ branch.latitude or '' }}" placeholder="e.g. 13.0827">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Longitude</label>
                        <input type="text" name="longitude" id="lng-input" class="form-control" value="{{ branch.longitude or '' }}" placeholder="e.g. 80.2707">
                    </div>
                </div>
                <div id="map-picker" class="mb-3 border border-secondary rounded-3" style="height: 300px;"></div>
                <p class="text-secondary small mb-3"><i class="fas fa-info-circle me-1"></i>Click on the map or drag the marker to update coordinates</p>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">2W Slots</label>
                        <input type="number" name="slots_2w" class="form-control" value="{{ branch.slots_2w_total }}" min="0" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">4W Slots</label>
                        <input type="number" name="slots_4w" class="form-control" value="{{ branch.slots_4w_total }}" min="0" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">2W Price per Hour (₹)</label>
                        <input type="number" step="0.01" name="price_2w" class="form-control" value="{{ branch.price_2w_per_hour }}" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">4W Price per Hour (₹)</label>
                        <input type="number" step="0.01" name="price_4w" class="form-control" value="{{ branch.price_4w_per_hour }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Opening Time</label>
                        <input type="time" name="open_time" class="form-control" value="{{ branch.open_time.strftime('%H:%M') }}" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Closing Time</label>
                        <input type="time" name="close_time" class="form-control" value="{{ branch.close_time.strftime('%H:%M') }}" required>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('admin.stations') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function initMap() {
        const initialPosition = {
            lat: {{ branch.latitude or 11.1271 }},
            lng: {{ branch.longitude or 78.6569 }}
        };
        const map = new google.maps.Map(document.getElementById('map-picker'), {
            zoom: 10,
            center: initialPosition,
        });
        const marker = new google.maps.Marker({
            position: initialPosition,
            map: map,
            draggable: true,
        });

        function updateInputs(latLng) {
            document.getElementById('lat-input').value = latLng.lat().toFixed(6);
            document.getElementById('lng-input').value = latLng.lng().toFixed(6);
        }

        map.addListener('click', function(event) {
            marker.setPosition(event.latLng);
            updateInputs(event.latLng);
        });
        marker.addListener('dragend', function(event) {
            updateInputs(event.latLng);
        });
    }
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key={{ gmaps_api_key }}&callback=initMap"></script>
{% endblock %}
